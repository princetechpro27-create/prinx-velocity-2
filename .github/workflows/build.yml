name: Compile Godot Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Godot APK Game
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Export Godot Project to APK
        uses: abarrak/godot-action@v1
        with:
          name: prinx-velocity
          preset: android
          export-path: bin/prinx-velocity.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrinxVelocityAPK
          path: bin/prinx-velocity.apk
