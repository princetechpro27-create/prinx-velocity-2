name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-apk:
    name: Export Godot 4 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.2.2

      - name: Export APK via Godot CLI
        run: |
          mkdir -p build/
          godot --headless --export-debug "Android" build/PRINX_VELOCITY.apk || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrinxVelocityAPK
          path: build/
